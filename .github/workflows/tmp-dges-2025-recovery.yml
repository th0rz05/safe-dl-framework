name: Temporary DGES 2025 placed-list probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-placed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query exact col1listacol endpoints and replay captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dges-2025-colocados/html
          python - <<'PY'
          from __future__ import annotations
          import csv, json, re, subprocess, urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path

          root=Path('dges-2025-colocados'); html_dir=root/'html'
          ua='Mozilla/5.0 (compatible; DGES2025Recovery/1.0; public archival research)'

          def get(url, timeout=20):
              p=subprocess.run(['curl','-fsSL','--compressed','--retry','2','--retry-delay','1','--connect-timeout','6','--max-time',str(timeout),'-A',ua,url],capture_output=True)
              return p.returncode,p.stdout,p.stderr.decode('utf-8','replace')

          entries=[]; queries=[]
          for pattern in ('dges.gov.pt/coloc/2025/col1listacol.asp*','www.dges.gov.pt/coloc/2025/col1listacol.asp*'):
              params=[('url',pattern),('output','json'),('filter','statuscode:200'),('fl','timestamp,original,statuscode,mimetype,digest,length'),('from','2025'),('to','2026'),('limit','100000')]
              api='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              rc,body,err=get(api,25)
              queries.append({'pattern':pattern,'api':api,'returncode':rc,'bytes':len(body),'stderr':err[:1000],'body_preview':body[:1000].decode('utf-8','replace')})
              print('QUERY',pattern,'RC',rc,'BYTES',len(body),flush=True)
              if rc==0:
                  try:
                      obj=json.loads(body)
                      if obj and isinstance(obj,list):
                          head=obj[0]
                          for row in obj[1:]: entries.append(dict(zip(head,row)))
                  except Exception as exc: print('PARSE ERROR',repr(exc),flush=True)

          seen=set(); unique=[]
          for x in entries:
              k=(x.get('timestamp'),x.get('original'),x.get('digest'))
              if k not in seen: seen.add(k); unique.append(x)
          unique=sorted(unique,key=lambda x:(x.get('timestamp',''),x.get('original',''),x.get('digest','')))
          print('CAPTURE COUNT',len(unique),flush=True)
          for x in unique: print('CAPTURE',x.get('timestamp'),x.get('original'),x.get('digest'),flush=True)

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.rows=[]; self.row=None; self.cell=None; self.title=[]; self.it=False
              def handle_starttag(self,t,a):
                  t=t.lower()
                  if t=='title': self.it=True
                  if t=='tr': self.row=[]
                  elif t in ('td','th') and self.row is not None: self.cell=[]
              def handle_endtag(self,t):
                  t=t.lower()
                  if t=='title': self.it=False
                  if t in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).replace('\xa0',' ').split())); self.cell=None
                  elif t=='tr' and self.row is not None:
                      if any(c.strip() for c in self.row): self.rows.append(self.row)
                      self.row=None; self.cell=None
              def handle_data(self,d):
                  if self.it: self.title.append(d)
                  if self.cell is not None: self.cell.append(d)

          pages=[]; rows=[]
          for i,x in enumerate(unique,1):
              ts=x.get('timestamp',''); orig=x.get('original','')
              replay=f'https://web.archive.org/web/{ts}id_/{orig}'
              rc,body,err=get(replay,25)
              (html_dir/f'pagina_{i:03d}_{ts}.html').write_bytes(body)
              text=body.decode('iso-8859-1','replace'); p=P()
              try: p.feed(text)
              except Exception as exc: print('HTML ERROR',repr(exc),flush=True)
              title=' '.join(''.join(p.title).split())
              marker=bool(re.search(r'Lista(?:gem)?\s+(?:de\s+)?Colocados|Colocados no Ensino Superior',text,re.I))
              pages.append({'pagina':i,'timestamp':ts,'original':orig,'replay':replay,'returncode':rc,'bytes':len(body),'title':title,'rows':len(p.rows),'marcador_colocados':marker,'stderr':err[:1000]})
              print('PAGE',i,'RC',rc,'BYTES',len(body),'ROWS',len(p.rows),'MARKER',marker,'TITLE',title,flush=True)
              for n,c in enumerate(p.rows): rows.append({'pagina':i,'timestamp':ts,'original':orig,'linha':n,'cells':c})

          maxc=max([len(x['cells']) for x in rows] or [0])
          with (root/'linhas.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['pagina','timestamp','url_original','linha']+[f'campo_{i+1}' for i in range(maxc)])
              for x in rows: w.writerow([x['pagina'],x['timestamp'],x['original'],x['linha']]+x['cells'])
          result={'consultas':queries,'capturas':unique,'paginas':pages,'resumo':{'capturas_encontradas':len(unique),'paginas_reproduzidas':len(pages),'paginas_com_marcador_colocados':sum(p['marcador_colocados'] for p in pages),'linhas_tabela':len(rows)}}
          (root/'resultado.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'LEIA-ME.txt').write_text('Resultado da pesquisa Wayback aos endpoints DGES 2025 col1listacol.asp, sem colapsar capturas.\n',encoding='utf-8')
          print('RESULT',json.dumps(result['resumo'],ensure_ascii=False),flush=True)
          PY
          zip -qr dges-2025-colocados.zip dges-2025-colocados
      - uses: actions/upload-artifact@v4
        with:
          name: dges-2025-colocados-probe
          path: |
            dges-2025-colocados/
            dges-2025-colocados.zip
          retention-days: 1
