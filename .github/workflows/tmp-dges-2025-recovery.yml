name: Temporary DGES 2025 recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-confirmed-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract confirmed archived pages
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, json, re, time, urllib.error, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          OUT=Path('dges-2025-extracted'); RAW=OUT/'html'
          OUT.mkdir(); RAW.mkdir()
          UA='Mozilla/5.0 (compatible; DGES2025Recovery/1.0; public archival research)'
          captures=[
            ('20251106120603','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=31&ide=60&Mx=723'),
            ('20251106120404','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=61&ide=90&Mx=723'),
            ('20251106120407','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=91&ide=120&Mx=723'),
            ('20251106120420','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodCurso=9494&ids=121&ide=150&Mx=723&CodEstab=1106'),
            ('20251106120502','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=421&ide=450&Mx=723'),
            ('20251106120505','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=451&ide=480&Mx=723'),
            ('20251106120513','https://www.dges.gov.pt/coloc/2025/col1listaser.asp?ide=480&Mx=723&CodEstab=1106&CodCurso=9494&ids=451'),
          ]

          def fetch(url,timeout=30):
            last=''
            for i in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*','Accept-Encoding':'identity'})
                with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,dict(r.headers.items()),r.read(),r.geturl()
              except urllib.error.HTTPError as e:
                return e.code,dict(e.headers.items()),e.read(),e.geturl()
              except Exception as e:
                last=repr(e); time.sleep(i+1)
            return 0,{},last.encode(),url

          class P(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=True); self.rows=[]; self.row=None; self.cell=None; self.title=[]; self.it=False
            def handle_starttag(self,t,a):
              t=t.lower()
              if t=='title': self.it=True
              elif t=='tr': self.row=[]
              elif t in ('td','th') and self.row is not None: self.cell=[]
            def handle_endtag(self,t):
              t=t.lower()
              if t=='title': self.it=False
              elif t in ('td','th') and self.cell is not None and self.row is not None:
                self.row.append(' '.join(''.join(self.cell).replace('\xa0',' ').split())); self.cell=None
              elif t=='tr' and self.row is not None:
                if any(x for x in self.row): self.rows.append(self.row)
                self.row=None; self.cell=None
            def handle_data(self,d):
              if self.it: self.title.append(d)
              if self.cell is not None: self.cell.append(d)

          pages=[]; rows=[]
          for i,(ts,orig) in enumerate(captures):
            replay=f'https://web.archive.org/web/{ts}id_/{orig}'
            st,hd,body,final=fetch(replay)
            # DGES pages historically use ISO-8859-1.
            for enc in ('utf-8','iso-8859-1'):
              try:
                text=body.decode(enc)
                if '\ufffd' not in text: break
              except Exception: text=''
            if not text: text=body.decode('iso-8859-1','replace')
            (RAW/f'page_{i+1:02d}_{ts}.html').write_bytes(body)
            p=P()
            try: p.feed(text)
            except Exception as e: print('PARSE_ERR',repr(e),flush=True)
            title=' '.join(''.join(p.title).split())
            pages.append({'page':i+1,'timestamp':ts,'original':orig,'replay':replay,'status':st,'final':final,'bytes':len(body),'title':title,'rows':len(p.rows)})
            for n,r in enumerate(p.rows): rows.append({'page':i+1,'timestamp':ts,'original':orig,'row':n,'cells':r})
            print('PAGE',i+1,'STATUS',st,'BYTES',len(body),'ROWS',len(p.rows),'TITLE',title,flush=True)
            for r in p.rows[:8]: print('SHAPE',len(r),'FIELDS',json.dumps(['[PESSOAL]' if j==1 and len(r)>=6 else x for j,x in enumerate(r)],ensure_ascii=False),flush=True)

          # Remove exact duplicate page content/rows (two captures cover 451-480).
          unique=[]; seen=set()
          for x in rows:
            k=tuple(x['cells'])
            if k in seen: continue
            seen.add(k); unique.append(x)

          maxc=max([len(x['cells']) for x in unique] or [0])
          headers=['page','timestamp','original','source_row']+[f'campo_{i+1}' for i in range(maxc)]
          with (OUT/'todas_as_linhas.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f); w.writerow(headers)
            for x in unique: w.writerow([x['page'],x['timestamp'],x['original'],x['row']]+x['cells'])

          # Candidate table rows normally have many columns and a numeric order/rank or candidate number.
          candidates=[]
          for x in unique:
            c=x['cells']
            joined=' '.join(c).lower()
            if len(c)>=6 and not any(k in joined for k in ('nota de candidatura','candidato','ordem','opção','prova de ingresso')):
              if sum(bool(re.search(r'\d',v)) for v in c)>=3: candidates.append(x)
          with (OUT/'candidatos_recuperados.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f); w.writerow(headers)
            for x in candidates: w.writerow([x['page'],x['timestamp'],x['original'],x['row']]+x['cells'])

          summary={'pages':len(pages),'http_200':sum(x['status']==200 for x in pages),'raw_rows':len(rows),'unique_rows':len(unique),'candidate_like_rows':len(candidates),'page_titles':sorted(set(x['title'] for x in pages if x['title']))}
          (OUT/'paginas.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'resumo.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'LEIA-ME.txt').write_text('Recuperação parcial das listas públicas de candidatos da 1.ª fase DGES 2025. Curso 1106/9494: Universidade do Porto - Faculdade de Farmácia / Ciências Farmacêuticas. Intervalos arquivados: 31-150 e 421-480; o intervalo 451-480 tinha duas capturas e foi desduplicado. Os ficheiros HTML preservam as páginas originais; os CSV resultam da extração automática das tabelas.\n',encoding='utf-8')
          print('SUMMARY',json.dumps(summary,ensure_ascii=False),flush=True)
          PY
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: dges-2025-extracted
          path: dges-2025-extracted/
          retention-days: 1
