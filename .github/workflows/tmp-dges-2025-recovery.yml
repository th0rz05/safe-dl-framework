name: Temporary DGES 2025 recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fast archive probe
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          out = Path('dges-fast-probe')
          out.mkdir()
          ua = 'Mozilla/5.0 (compatible; DGES2025ArchiveProbe/1.0)'
          results=[]

          def fetch(label, url, timeout=15):
              print(f'>>> {label}\n{url}', flush=True)
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':ua,'Accept':'*/*','Accept-Encoding':'identity'})
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body=r.read()
                      rec={'label':label,'url':url,'status':r.status,'final':r.geturl(),'type':r.headers.get('Content-Type',''),'bytes':len(body),'preview':body[:4000].decode('utf-8','replace')}
              except urllib.error.HTTPError as e:
                  body=e.read()
                  rec={'label':label,'url':url,'status':e.code,'final':e.geturl(),'type':e.headers.get('Content-Type',''),'bytes':len(body),'preview':body[:4000].decode('utf-8','replace')}
              except Exception as e:
                  rec={'label':label,'url':url,'status':0,'final':url,'type':'','bytes':0,'preview':repr(e)}
              results.append(rec)
              print(json.dumps(rec, ensure_ascii=False), flush=True)
              (out/(str(len(results)).zfill(2)+'_'+label.replace('/','_')+'.txt')).write_text(rec['preview'], encoding='utf-8')
              return rec

          target='https://dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1108&CodCurso=9813&ids=0&ide=10000&Mx=10000'
          base='https://dges.gov.pt/coloc/2025/col1listaser.asp'
          directory='https://dges.gov.pt/coloc/2025/'
          fetch('live_exact', target)
          for i,t in enumerate([base,target]):
              enc=urllib.parse.quote(t, safe=':/?=&%')
              fetch(f'arquivo_timemap_{i}', 'https://arquivo.pt/wayback/timemap/json/'+enc)
              fetch(f'arquivo_timemap_link_{i}', 'https://arquivo.pt/wayback/timemap/link/'+enc)
          for i,t in enumerate([base,target,directory]):
              q=urllib.parse.urlencode({'url':t,'matchType':'prefix','output':'json','from':'2025','to':'2026','limit':'100000'})
              fetch(f'arquivo_cdx_{i}', 'https://arquivo.pt/wayback/cdx?'+q)
          for crawl in ['CC-MAIN-2025-33','CC-MAIN-2025-38','CC-MAIN-2025-43','CC-MAIN-2025-47','CC-MAIN-2025-51','CC-MAIN-2026-04']:
              q=urllib.parse.urlencode({'url':'dges.gov.pt/coloc/2025/col1listaser.asp*','output':'json'})
              fetch('cc_'+crawl, f'https://index.commoncrawl.org/{crawl}-index?'+q)
          q=urllib.parse.urlencode({'url':'dges.gov.pt/coloc/2025/col1listaser.asp*','output':'json','filter':'statuscode:200','fl':'timestamp,original,statuscode,mimetype,digest,length','from':'2025','to':'2026','limit':'100000'})
          fetch('wayback_cdx', 'https://web.archive.org/cdx/search/cdx?'+q)
          (out/'results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dges-fast-probe
          path: dges-fast-probe/
          retention-days: 1
