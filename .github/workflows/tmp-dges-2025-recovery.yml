name: Temporary DGES 2025 recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download confirmed pages and generate CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dges-2025-recuperado/html
          cat > /tmp/captures.tsv <<'EOF'
          20251106120603	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=31&ide=60&Mx=723
          20251106120404	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=61&ide=90&Mx=723
          20251106120407	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=91&ide=120&Mx=723
          20251106120420	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodCurso=9494&ids=121&ide=150&Mx=723&CodEstab=1106
          20251106120502	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=421&ide=450&Mx=723
          20251106120505	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=451&ide=480&Mx=723
          20251106120513	https://www.dges.gov.pt/coloc/2025/col1listaser.asp?ide=480&Mx=723&CodEstab=1106&CodCurso=9494&ids=451
          EOF
          : > dges-2025-recuperado/fontes.tsv
          n=0
          while IFS=$'\t' read -r ts orig; do
            n=$((n+1)); printf -v fn 'dges-2025-recuperado/html/pagina_%02d_%s.html' "$n" "$ts"
            curl -fLsS --compressed --retry 4 --retry-delay 1 --connect-timeout 8 --max-time 25 \
              -A 'Mozilla/5.0 (compatible; DGES2025Recovery/1.0; public archival research)' \
              -o "$fn" "https://web.archive.org/web/${ts}id_/${orig}"
            printf '%s\t%s\t%s\n' "$n" "$ts" "$orig" >> dges-2025-recuperado/fontes.tsv
            echo "Página $n: $(wc -c < "$fn") bytes"
          done < /tmp/captures.tsv

          python - <<'PY'
          from __future__ import annotations
          import csv, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          root=Path('dges-2025-recuperado'); htmldir=root/'html'
          sources=[]
          for line in (root/'fontes.tsv').read_text(encoding='utf-8').splitlines():
              n,ts,url=line.split('\t',2); sources.append((int(n),ts,url))

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows=[]; self.row=None; self.cell=None; self.title=[]; self.in_title=False
                  self.in_script=0; self.in_style=0
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower()
                  if tag=='script': self.in_script+=1
                  if tag=='style': self.in_style+=1
                  if tag=='title': self.in_title=True
                  if tag=='tr': self.row=[]
                  elif tag in ('td','th') and self.row is not None: self.cell=[]
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if tag=='script' and self.in_script: self.in_script-=1
                  if tag=='style' and self.in_style: self.in_style-=1
                  if tag=='title': self.in_title=False
                  if tag in ('td','th') and self.cell is not None and self.row is not None:
                      self.row.append(' '.join(''.join(self.cell).replace('\xa0',' ').split())); self.cell=None
                  elif tag=='tr' and self.row is not None:
                      if any(c.strip() for c in self.row): self.rows.append(self.row)
                      self.row=None; self.cell=None
              def handle_data(self,data):
                  if self.in_title: self.title.append(data)
                  if not self.in_script and not self.in_style and self.cell is not None: self.cell.append(data)

          pages=[]; all_rows=[]
          for n,ts,url in sources:
              fn=htmldir/f'pagina_{n:02d}_{ts}.html'; text=fn.read_bytes().decode('iso-8859-1','replace')
              p=Parser(); p.feed(text); q=parse_qs(urlparse(url).query)
              pages.append({'pagina':n,'timestamp':ts,'url_original':url,'titulo':' '.join(''.join(p.title).split()),'linhas_tabela':len(p.rows),'inicio':q.get('ids',[''])[0],'fim':q.get('ide',[''])[0],'total':q.get('Mx',[''])[0]})
              for i,cells in enumerate(p.rows): all_rows.append({'pagina':n,'timestamp':ts,'url':url,'linha':i,'cells':cells})

          # Exact row deduplication removes the second archived copy of positions 451–480.
          unique=[]; seen=set()
          for r in all_rows:
              k=tuple(r['cells'])
              if k not in seen: seen.add(k); unique.append(r)

          maxcols=max([len(r['cells']) for r in unique] or [0])
          fields=['pagina','timestamp','url_original','linha_origem']+[f'campo_{i+1}' for i in range(maxcols)]
          def save(path,rows):
              with path.open('w',newline='',encoding='utf-8-sig') as f:
                  w=csv.writer(f); w.writerow(fields)
                  for r in rows: w.writerow([r['pagina'],r['timestamp'],r['url'],r['linha']]+r['cells'])
          save(root/'todas_as_linhas.csv',unique)

          # Locate candidate rows based on the actual eight-column shape used by DGES.
          headers=[]; candidates=[]
          for r in unique:
              low=' | '.join(r['cells']).lower(); c=r['cells']
              if 'nota de candidatura' in low or ('nome' in low and ('opção' in low or 'opcao' in low)):
                  headers.append(c); continue
              if len(c)>=7 and sum(bool(re.search(r'\d',x)) for x in c)>=4:
                  if not any(s in low for s in ('universidade do porto','ciências farmacêuticas','listagem ordenada','página anterior','página seguinte')):
                      candidates.append(r)
          save(root/'candidatos_recuperados.csv',candidates)

          widths={}
          for r in candidates: widths[len(r['cells'])]=widths.get(len(r['cells']),0)+1
          dominant=max(widths,key=widths.get) if widths else 0
          normalized=[r for r in candidates if len(r['cells'])==dominant]
          with (root/'candidatos_normalizados.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['pagina','timestamp']+[f'coluna_{i+1}' for i in range(dominant)])
              for r in normalized: w.writerow([r['pagina'],r['timestamp']]+r['cells'])

          summary={
            'curso_codigo':'1106/9494','instituicao':'Universidade do Porto - Faculdade de Farmácia','curso':'Ciências Farmacêuticas','fase':'1.ª fase de 2025',
            'total_candidatos_indicado':723,'intervalos_recuperados':['31-60','61-90','91-120','121-150','421-450','451-480'],
            'paginas_arquivadas':len(pages),'linhas_brutas':len(all_rows),'linhas_unicas':len(unique),'registos_candidatos_extraidos':len(candidates),
            'largura_dominante':dominant,'distribuicao_larguras':widths,'cabecalhos_encontrados':headers,
            'estado':'parcial','nota':'O Wayback preservou 180 posições únicas de uma lista de 723 candidatos; não preservou os restantes intervalos.'}
          (root/'paginas_recuperadas.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'resumo.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'LEIA-ME.txt').write_text(
            'Dados públicos DGES 2025 recuperados da Wayback Machine.\n\n'
            'Curso 1106/9494 — Universidade do Porto, Faculdade de Farmácia — Ciências Farmacêuticas.\n'
            'Lista ordenada de candidatos, 1.ª fase de 2025.\n'
            'Foram preservadas as posições 31–150 e 421–480 (180 posições únicas de 723).\n'
            'Os HTML são as páginas originais arquivadas; os CSV são extrações auditáveis.\n',encoding='utf-8')
          print('PAGES',json.dumps(pages,ensure_ascii=False))
          print('SUMMARY',json.dumps(summary,ensure_ascii=False))
          PY

          zip -qr dges-2025-recuperado.zip dges-2025-recuperado

      - uses: actions/upload-artifact@v4
        with:
          name: dges-2025-recuperado
          path: |
            dges-2025-recuperado/
            dges-2025-recuperado.zip
          retention-days: 1
