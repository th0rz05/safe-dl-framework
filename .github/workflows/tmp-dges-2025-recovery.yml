name: Temporary DGES 2025 placed-list index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-placed-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch exact Wayback CDX indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dges-2025-colocados-indice
          python - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path

          root=Path('dges-2025-colocados-indice')
          ua='Mozilla/5.0 (compatible; DGES2025Recovery/1.0; public archival research)'
          all_entries=[]; queries=[]
          for pattern in ('dges.gov.pt/coloc/2025/col1listacol.asp*','www.dges.gov.pt/coloc/2025/col1listacol.asp*'):
              params=[('url',pattern),('output','json'),('filter','statuscode:200'),('fl','timestamp,original,statuscode,mimetype,digest,length'),('from','2025'),('to','2026'),('limit','100000')]
              api='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              p=subprocess.run(['curl','-fsSL','--compressed','--retry','2','--retry-delay','1','--connect-timeout','6','--max-time','35','-A',ua,api],capture_output=True)
              q={'pattern':pattern,'api':api,'returncode':p.returncode,'bytes':len(p.stdout),'stderr':p.stderr.decode('utf-8','replace')[:1000]}
              if p.returncode==0:
                  try:
                      arr=json.loads(p.stdout)
                      if arr and isinstance(arr,list):
                          head=arr[0]; found=[dict(zip(head,row)) for row in arr[1:]]
                          all_entries.extend(found); q['records']=len(found)
                      else: q['records']=0
                  except Exception as e:
                      q['records']=0; q['parse_error']=repr(e); q['body_preview']=p.stdout[:1000].decode('utf-8','replace')
              queries.append(q)
              print('QUERY',json.dumps(q,ensure_ascii=False),flush=True)

          seen=set(); unique=[]
          for x in all_entries:
              k=(x.get('timestamp'),x.get('original'),x.get('digest'))
              if k not in seen: seen.add(k); unique.append(x)
          unique=sorted(unique,key=lambda x:(x.get('timestamp',''),x.get('original',''),x.get('digest','')))
          by_digest={}; by_original={}; by_day={}
          for x in unique:
              by_digest[x.get('digest','')]=by_digest.get(x.get('digest',''),0)+1
              by_original[x.get('original','')]=by_original.get(x.get('original',''),0)+1
              day=x.get('timestamp','')[:8]; by_day[day]=by_day.get(day,0)+1
          result={'queries':queries,'entries':unique,'summary':{
              'records_before_deduplication':len(all_entries),
              'unique_timestamp_original_digest':len(unique),
              'unique_digests':len(by_digest),
              'unique_original_urls':len(by_original),
              'by_day':by_day,
              'by_original':by_original,
              'digest_multiplicity':sorted(by_digest.items(),key=lambda kv:(-kv[1],kv[0]))
          }}
          (root/'indice_col1listacol_2025.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'urls_reproducao.txt').write_text('\n'.join(f"https://web.archive.org/web/{x.get('timestamp')}id_/{x.get('original')}" for x in unique)+'\n',encoding='utf-8')
          print('SUMMARY',json.dumps(result['summary'],ensure_ascii=False),flush=True)
          for x in unique[:50]: print('ENTRY',x.get('timestamp'),x.get('original'),x.get('digest'),x.get('length'),flush=True)
          PY
          zip -qr dges-2025-colocados-indice.zip dges-2025-colocados-indice
      - uses: actions/upload-artifact@v4
        with:
          name: dges-2025-colocados-indice
          path: |
            dges-2025-colocados-indice/
            dges-2025-colocados-indice.zip
          retention-days: 1
