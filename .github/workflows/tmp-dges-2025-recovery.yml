name: Temporary DGES 2025 recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-replay-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe archived-page replay variants
        shell: bash
        run: |
          set +e
          orig='https://www.dges.gov.pt/coloc/2025/col1listaser.asp?CodEstab=1106&CodCurso=9494&ids=91&ide=120&Mx=723'
          ts='20251106120407'
          encoded=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$orig")
          urls=(
            "https://web.archive.org/web/${ts}/${orig}"
            "https://web.archive.org/web/${ts}id_/${orig}"
            "https://web.archive.org/web/${ts}if_/${orig}"
            "https://web.archive.org/web/${ts}im_/${orig}"
            "https://web.archive.org/web/${ts}/${encoded}"
            "https://web.archive.org/web/${ts}id_/${encoded}"
            "https://archive.org/wayback/available?url=${encoded}&timestamp=${ts}"
            "http://web.archive.org/web/${ts}id_/${orig}"
          )
          i=0
          mkdir -p replay-probe
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "===== VARIANT $i ====="
            echo "$u"
            curl -L --compressed --connect-timeout 5 --max-time 12 \
              -A 'Mozilla/5.0 (compatible; DGES2025Recovery/1.0)' \
              -D "replay-probe/${i}.headers" -o "replay-probe/${i}.body" \
              -w 'HTTP=%{http_code} final=%{url_effective} bytes=%{size_download} type=%{content_type} time=%{time_total}\n' "$u"
            echo '-- headers --'; sed -n '1,30p' "replay-probe/${i}.headers"
            echo '-- body preview --'; head -c 1200 "replay-probe/${i}.body" | tr '\000' ' '; echo
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dges-wayback-replay-probe
          path: replay-probe/
          retention-days: 1
